name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Show runner context
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $GIT_REF"
          echo "GitHub SHA: $GIT_SHA"
          echo "Checked out SHA: $(git rev-parse HEAD)"
          echo "Runner OS: $RUNNER_OS"
          echo "Workspace: $GITHUB_WORKSPACE"
          uname -a
          java -version

      - name: Build with Gradle Wrapper
        run: ./gradlew build --console=plain
  inspect:
    name: Inspect second runner
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Look for the JAR
        run: |
          if [ -d build/libs ]; then
            ls -lh build/libs
          else
            echo "build/libs is absent on this runner"
          fi
